<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;700&family=Martian+Mono:wdth,wght@75..112.5,300..800&display=block" rel="stylesheet"><style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent}
  .face{position:relative;overflow:hidden;font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased}
  .grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply}
  .wm{display:flex;align-items:center;gap:.32em;font-family:'Martian Mono',monospace;font-weight:800;font-stretch:75%;font-variation-settings:'wdth' 75;letter-spacing:.02em;line-height:1}
  .dia{display:inline-block;background:#E50107;transform:rotate(45deg);flex-shrink:0}
  .foil{background:linear-gradient(100deg,#8d9096 0%,#f4f5f7 28%,#a7aab0 46%,#ffffff 58%,#8a8d93 78%,#d9dbde 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .qr svg{width:100%;height:100%;display:block}
  .lbl{font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
  .mono{font-family:'Martian Mono',monospace;font-stretch:87.5%;font-variation-settings:'wdth' 87.5}
  .osw{font-family:'Oswald',sans-serif;text-transform:uppercase}
body{background:#f5f3f3}
  body{background:#f5f3f3}
  .scale{padding:48px 56px;width:1500px}
  .head{font-size:18px;color:#555;margin-bottom:36px}
  .items{display:flex;gap:80px;align-items:flex-end}
  figure{position:relative}
  figure img{display:block;box-shadow:0 18px 40px rgba(0,0,0,.18)}
  figcaption{margin-top:16px;font-size:16px;color:#333}
  .phone{border-radius:70px;background:#111;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .screen{position:relative;width:100%;height:100%;border-radius:54px;background:linear-gradient(180deg,#2a2a2c,#18181a);display:flex;align-items:flex-end;justify-content:center;padding-bottom:40px}
  .screen span{color:#aaa;font-size:15px}
  .vf{position:absolute;left:50%;top:40%;width:58%;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.7);border-radius:28px}
  .ccbox{position:absolute;left:0;bottom:44px;border:2px dashed rgba(0,0,0,.35);pointer-events:none}
  .ccbox span{position:absolute;left:0;top:calc(100% + 54px);font-size:14px;color:#777;white-space:nowrap}
</style></head><body>
  <div class="scale">
    <div class="lbl head">TERRITORY B — THE ACCESS CARD · TRUE SCALE (1 MM = 7 PX)</div>
    <div class="items">
      <figure><div class="phone" style="width:501.19999999999993px;height:1033.2px"><div class="screen"><div class="vf"></div><span class="lbl">PHONE CAMERA · 71.6 × 147.6 MM</span></div></div></figure>
      <figure><img src="#embedded-render" style="width:622.3000000000001px;height:355.59999999999997px"/><figcaption class="lbl">INVITATION 001 · 88.9 × 50.8 × 1 MM</figcaption>
        <div class="ccbox" style="width:599.1999999999999px;height:377.85999999999996px"><span class="lbl">PAYMENT CARD OUTLINE 85.6 × 54 MM (FOR SIZE ONLY)</span></div></figure>
    </div>
  </div></body></html>
