name: Deploy SITE 00 to GoDaddy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-godaddy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production SPA
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SITE00_ROOT: '1'
          VITE_SITE00_CANONICAL_ORIGIN: https://site00.com
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: npm run build

      - name: Deploy dist/ to GoDaddy (FTP)
        if: vars.GODADDY_DEPLOY_ENABLED == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.GODADDY_FTP_HOST }}
          username: ${{ secrets.GODADDY_FTP_USERNAME }}
          password: ${{ secrets.GODADDY_FTP_PASSWORD }}
          local-dir: dist/
          server-dir: ${{ vars.GODADDY_FTP_SERVER_DIR || './' }}
          dangerous-clean-slate: false

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: site00-production-dist
          path: dist/
          retention-days: 14
