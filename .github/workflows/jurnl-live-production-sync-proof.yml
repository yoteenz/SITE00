name: JURNL Live RLS & Production Sync Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/projects/jurnl/data/repository/**'
      - 'src/projects/jurnl/runtime/state/store.tsx'
      - 'api/jurnl/**'
      - 'supabase/migrations/*jurnl*'
      - 'scripts/jurnl/run-live-rls-and-sync-proof.ts'
      - 'scripts/jurnl/write-live-proof-artifacts.ts'
      - 'scripts/jurnl/live-proof/**'
      - 'scripts/jurnl/live-proof-prerequisite-precheck.ts'
      - 'scripts/jurnl/write-live-proof-unblock-artifacts.ts'
      - 'docs/jurnl/structural-completion/wave5-live-proof-unblock/**'
      - '.github/workflows/jurnl-live-production-sync-proof.yml'

concurrency:
  group: jurnl-live-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live_proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      live_ran: ${{ steps.precheck.outputs.ready }}
    env:
      JURNL_LIVE_PROOF: '1'
      JURNL_LIVE_QA_SETUP: '1'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JURNL_LIVE_API_BASE: ${{ secrets.JURNL_LIVE_API_BASE || secrets.VITE_API_BASE }}
      JURNL_QA_USER_A_EMAIL: ${{ secrets.JURNL_QA_USER_A_EMAIL }}
      JURNL_QA_USER_A_PASSWORD: ${{ secrets.JURNL_QA_USER_A_PASSWORD }}
      JURNL_QA_USER_B_EMAIL: ${{ secrets.JURNL_QA_USER_B_EMAIL }}
      JURNL_QA_USER_B_PASSWORD: ${{ secrets.JURNL_QA_USER_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run tests/jurnlDeviceServerMerge.test.ts tests/jurnlWave5Production.test.ts tests/jurnlLiveProofPrecheck.test.ts
      - name: Live proof prerequisite precheck
        id: precheck
        run: |
          npm run jurnl:live-proof:unblock-artifacts || true
          npm run jurnl:live-proof:precheck && echo "ready=1" >> "$GITHUB_OUTPUT" || echo "ready=0" >> "$GITHUB_OUTPUT"
      - name: Live RLS and sync proof
        if: steps.precheck.outputs.ready == '1'
        run: npm run jurnl:live-proof
      - name: Write prerequisite-blocked live proof result
        if: steps.precheck.outputs.ready != '1'
        run: |
          mkdir -p docs/jurnl/structural-completion/wave5-live-proof
          npx tsx scripts/jurnl/write-live-proof-artifacts.ts
          node -e "
          const fs=require('fs');
          const p='docs/jurnl/structural-completion/wave5-live-proof/JURNL_LIVE_PRODUCTION_SYNC_E2E_RESULT.json';
          const u='docs/jurnl/structural-completion/wave5-live-proof-unblock/JURNL_LIVE_PROOF_ENVIRONMENT_READINESS.json';
          let missing=[];
          try { missing=JSON.parse(fs.readFileSync(u,'utf8')).missing_secret_names||[]; } catch {}
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.gate_status='PREREQUISITE_BLOCKED';
          j.note='Install missing GitHub secrets and apply JURNL migration — see wave5-live-proof-unblock/';
          j.missing_secret_names=missing;
          fs.writeFileSync(p,JSON.stringify(j,null,2));
          "
      - name: Upload live proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jurnl-live-proof-artifacts
          retention-days: 30
          path: |
            docs/jurnl/structural-completion/wave5-live-proof/
            docs/jurnl/structural-completion/wave5-live-proof-unblock/

  regression_gates:
    needs: live_proof
    if: needs.live_proof.outputs.live_ran == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Full product E2E
        env:
          GITHUB_ACTIONS: 'true'
        run: npm run jurnl:e2e:gate
      - name: Production hardening E2E
        env:
          GITHUB_ACTIONS: 'true'
        run: npm run jurnl:e2e:wave5
