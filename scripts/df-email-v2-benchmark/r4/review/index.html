<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SITE 00 · EMAIL V2 · R4 PREMIUM EDITORIAL REVIEW</title>
<style>
  @font-face { font-family: "Saira Semi Condensed"; font-weight: 400; src: url("../fonts/SairaSemiCondensed-400.ttf"); }
  @font-face { font-family: "Saira Semi Condensed"; font-weight: 500; src: url("../fonts/SairaSemiCondensed-500.ttf"); }
  @font-face { font-family: "Saira Semi Condensed"; font-weight: 600; src: url("../fonts/SairaSemiCondensed-600.ttf"); }
  @font-face { font-family: "Saira Semi Condensed"; font-weight: 700; src: url("../fonts/SairaSemiCondensed-700.ttf"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 900; src: url("../fonts/barlow-condensed-900.woff2") format("woff2"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 800; src: url("../fonts/barlow-condensed-800.woff2") format("woff2"); }
  :root { --ink: #141414; --mute: #6b6964; --hair: #dedbd5; --stone: #f2f0ec; --red: #d90c0c; --bg: #e7e5e0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Saira Semi Condensed", "Arial Narrow", Arial, sans-serif; text-transform: uppercase; color: var(--ink); background: var(--bg); display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
  button, select { font: inherit; text-transform: inherit; }
  button { cursor: pointer; }
  .keep { text-transform: none; }

  header { background: var(--ink); color: #fff; padding: 12px 18px; display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; }
  header .w { font-size: 13px; font-weight: 700; letter-spacing: .32em; }
  header .t { font-size: 11px; letter-spacing: .22em; color: #b9b6b0; }
  header .st { margin-left: auto; font-size: 10px; letter-spacing: .22em; display: flex; align-items: center; gap: 8px; }
  header .st i { width: 7px; height: 7px; background: var(--red); display: inline-block; }

  .bar { background: #fff; border-bottom: 1px solid var(--hair); padding: 10px 18px; display: flex; gap: 10px 22px; flex-wrap: wrap; align-items: center; }
  .grp { display: flex; align-items: center; gap: 8px; }
  .grp > span { font-size: 9.5px; letter-spacing: .26em; color: var(--mute); }
  .seg { display: flex; border: 1px solid var(--ink); }
  .seg button { background: #fff; border: 0; border-right: 1px solid var(--ink); padding: 8px 11px 7px; font-size: 11px; font-weight: 600; letter-spacing: .14em; color: var(--ink); white-space: nowrap; }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .seg button:disabled { color: #bbb8b1; cursor: default; }

  main { flex: 1; display: flex; min-height: 0; }
  nav { width: 300px; flex: none; background: #fbfaf8; border-right: 1px solid var(--hair); overflow-y: auto; }
  nav h3 { margin: 0; padding: 16px 16px 8px; font-size: 10px; letter-spacing: .28em; color: var(--mute); font-weight: 600; display: flex; justify-content: space-between; position: sticky; top: 0; background: #fbfaf8; }
  .row { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--hair); background: transparent; padding: 11px 16px 12px; color: var(--ink); }
  .row:hover { background: #f4f2ee; }
  .row[aria-current="true"] { background: #fff; box-shadow: inset 3px 0 0 var(--red); }
  .row .top { display: flex; gap: 8px; align-items: center; font-size: 9.5px; letter-spacing: .2em; color: var(--mute); }
  .row .s { font-size: 12.5px; font-weight: 600; letter-spacing: .04em; margin: 5px 0 2px; line-height: 1.3; }
  .row .p { font-size: 11px; letter-spacing: .03em; color: var(--mute); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .cls { display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: .14em; padding: 2px 5px 1px; border: 1px solid currentColor; }
  .cls.P1 { color: #fff; background: var(--red); border-color: var(--red); }
  .cls.P2 { color: var(--ink); }
  .cls.P3 { color: var(--mute); border-style: dashed; }

  .stagewrap { flex: 1; min-width: 0; display: flex; gap: 18px; justify-content: center; align-items: flex-start; padding: 16px; overflow: hidden; }
  .dev { display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .dev .lab { font-size: 10px; letter-spacing: .24em; color: var(--mute); margin-bottom: 8px; white-space: nowrap; }
  .dev .lab b { color: var(--ink); }
  .frame { background: #fff; box-shadow: 0 1px 0 #cfccc5, 0 10px 30px rgba(0,0,0,.08); overflow: hidden; position: relative; }
  .frame iframe { border: 0; display: block; transform-origin: 0 0; position: absolute; top: 0; left: 0; background: #fff; }

  aside { width: 360px; flex: none; background: #fff; border-left: 1px solid var(--hair); overflow-y: auto; padding: 20px 22px 30px; }
  aside .e { font-size: 10px; letter-spacing: .26em; color: var(--mute); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  aside h1 { margin: 8px 0 4px; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 900; font-size: 38px; line-height: .9; letter-spacing: 0; }
  aside h1 i { display: inline-block; width: .15em; height: .15em; background: var(--red); margin-left: .05em; }
  aside .nm { font-size: 11px; letter-spacing: .2em; color: var(--mute); }
  aside h4 { margin: 22px 0 8px; font-size: 10px; letter-spacing: .28em; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  aside h4::before { content: ""; width: 14px; height: 2px; background: var(--red); }
  aside p, aside li { font-size: 12.5px; letter-spacing: .03em; line-height: 1.55; margin: 0; }
  aside ul { margin: 0; padding: 0; list-style: none; }
  aside li { border-top: 1px solid var(--hair); padding: 7px 0; display: flex; justify-content: space-between; gap: 12px; }
  aside li span:first-child { font-size: 10px; letter-spacing: .2em; color: var(--mute); white-space: nowrap; padding-top: 2px; }
  aside li span:last-child { text-align: right; overflow-wrap: anywhere; min-width: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--ink); background: #fff; padding: 5px 8px 4px; font-size: 10.5px; font-weight: 600; letter-spacing: .12em; }
  .chip.r { border-color: var(--red); color: var(--red); }
  .asset { display: flex; gap: 12px; align-items: center; border-top: 1px solid var(--hair); padding: 10px 0; }
  .asset img { width: 84px; height: 56px; object-fit: cover; flex: none; background: var(--stone); }
  .asset b { display: block; font-size: 11.5px; letter-spacing: .12em; }
  .asset small { font-size: 10px; letter-spacing: .14em; color: var(--mute); }
  .nav2 { display: flex; gap: 8px; margin-top: 22px; }
  .nav2 button { flex: 1; border: 1px solid var(--ink); background: #fff; padding: 10px; font-size: 11px; font-weight: 600; letter-spacing: .18em; }
  .ok { color: #1b7f3a; font-weight: 700; }

  .wall { flex: 1; overflow-y: auto; padding: 18px 22px 40px; }
  .wall h2 { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 900; font-size: 34px; margin: 18px 0 2px; letter-spacing: 0; }
  .wall .voice { font-size: 11.5px; letter-spacing: .08em; color: var(--mute); margin: 0 0 14px; max-width: 760px; line-height: 1.5; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 16px; }
  .tile { border: 0; background: transparent; padding: 0; text-align: left; color: var(--ink); }
  .tile .img { height: 300px; overflow: hidden; background: #fff; box-shadow: 0 1px 0 #cfccc5, 0 6px 18px rgba(0,0,0,.06); }
  .tile img { width: 100%; display: block; }
  .tile .meta { padding: 8px 2px 0; font-size: 10px; letter-spacing: .18em; color: var(--mute); display: flex; gap: 6px; align-items: center; }
  .tile .ttl { font-size: 12px; font-weight: 600; letter-spacing: .06em; margin-top: 3px; }
  .tile .rel { font-size: 10px; letter-spacing: .12em; color: var(--mute); margin-top: 2px; }
  .acards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
  .acard { background: #fff; box-shadow: 0 1px 0 #cfccc5; }
  .acard img { width: 100%; height: 190px; object-fit: cover; display: block; }
  .acard .in { padding: 12px 14px 14px; }
  .acard .id { font-size: 10px; letter-spacing: .24em; color: var(--mute); }
  .acard .n { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 800; font-size: 24px; letter-spacing: .01em; margin: 3px 0 8px; }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; margin: 6px 0 4px; font-size: 11px; letter-spacing: .06em; color: var(--mute); line-height: 1.45; }
  .legend div { max-width: 360px; }
  .pick { display: none; }

  @media (max-width: 1100px) { aside { width: 300px; } nav { width: 250px; } }
  @media (max-width: 860px) {
    body { height: auto; min-height: 100%; }
    main { flex-direction: column; }
    nav { display: none; }
    .pick { display: block; width: 100%; padding: 10px 12px; border: 1px solid var(--ink); background: #fff; font-size: 12px; font-weight: 600; letter-spacing: .08em; }
    .stagewrap { padding: 12px 10px; min-height: 72vh; }
    aside { width: auto; border-left: 0; border-top: 1px solid var(--hair); }
    header .st { margin-left: 0; }
    .bar { padding: 10px 12px; gap: 8px 14px; }
    .seg button { padding: 7px 8px 6px; font-size: 10px; letter-spacing: .1em; }
    .grp > span { display: none; }
    .tiles { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .tile .img { height: 240px; }
  }
</style>
</head>
<body>
<header>
  <div class="w">SITE 00</div>
  <div class="t">EMAIL V2 · R4 PREMIUM EDITORIAL · DIGITAL FOUNDATION · 20 TEMPLATES</div>
  <div class="st"><i></i><span id="status">FOUNDER REVIEW PENDING</span></div>
</header>
<div class="bar">
  <div class="grp"><span>VIEW</span><div class="seg" id="view"></div></div>
  <div class="grp"><span>FAMILY</span><div class="seg" id="family"></div></div>
  <div class="grp"><span>ART</span><div class="seg" id="klass"></div></div>
  <div class="grp" id="devgrp"><span>DEVICE</span><div class="seg" id="device"></div></div>
  <div class="grp" id="vergrp"><span>VERSION</span><div class="seg" id="version"></div></div>
  <select class="pick" id="pick" aria-label="Choose an email"></select>
</div>
<main id="main"></main>
<script src="data.js"></script>
<script>
(() => {
  const D = window.R4_DATA, P = window.R4_PATHS;
  const byId = Object.fromEntries(D.emails.map((e) => [e.template_id, e]));
  const assetById = Object.fromEntries(D.assets.map((a) => [a.asset_id, a]));
  const WIDTHS = { MOBILE: 390, TABLET: 768, DESKTOP: 1024 };
  const S = { view: 'EMAIL', family: 'ALL', klass: 'ALL', device: 'MOBILE', version: 'R4', id: D.emails[0].template_id };
  const fromHash = () => {
    const h = new URLSearchParams(location.hash.slice(1));
    for (const k of Object.keys(S)) if (h.get(k)) S[k] = h.get(k);
    if (!byId[S.id]) S.id = D.emails[0].template_id;
  };
  if (!location.hash && innerWidth > 860) S.device = 'ALL';
  fromHash();
  const toHash = () => history.replaceState(null, '', '#' + new URLSearchParams(S).toString());
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const plain = (s) => s.replace(/<[^>]+>/g, '').replace(/&amp;/g, '&');
  const visible = () => D.emails.filter((e) => (S.family === 'ALL' || e.family === S.family.toLowerCase()) && (S.klass === 'ALL' || e.visual_class === S.klass));
  const famLabel = { transactional: 'TRANSACTIONAL', operational: 'OPERATIONAL', marketing: 'MARKETING' };

  function seg(id, opts, key, labels = {}) {
    const el = document.getElementById(id);
    el.innerHTML = opts.map((o) => `<button aria-pressed="${S[key] === o}" data-v="${o}" ${o === 'R3' && !byId[S.id].r3_compare ? 'disabled' : ''}>${labels[o] || o}</button>`).join('');
    el.onclick = (ev) => {
      const b = ev.target.closest('button');
      if (!b || b.disabled) return;
      S[key] = b.dataset.v;
      if (key === 'family' || key === 'klass') { const v = visible(); if (v.length && !v.includes(byId[S.id])) S.id = v[0].template_id; }
      render();
    };
  }

  function frame(src, width, label, scale, height) {
    return `<div class="dev"><div class="lab">${label}</div><div class="frame" style="width:${Math.round(width * scale)}px;height:${Math.round(height * scale)}px">
      <iframe title="${esc(label)}" src="${src}" style="width:${width}px;height:${height}px;transform:scale(${scale})" loading="lazy"></iframe></div></div>`;
  }

  function stage(wrap) {
    const e = byId[S.id];
    const devs = S.device === 'ALL' ? ['MOBILE', 'TABLET', 'DESKTOP'] : [S.device];
    const versions = S.version === 'COMPARE' && e.r3_compare ? ['R3', 'R4'] : [S.version === 'R3' && e.r3_compare ? 'R3' : 'R4'];
    const items = versions.flatMap((v) => devs.map((d) => ({ v, d })));
    const avail = wrap.clientWidth - 32 - 18 * (items.length - 1);
    const total = items.reduce((n, x) => n + WIDTHS[x.d], 0);
    const scale = Math.min(1, avail / total);
    const h = Math.max(420, (wrap.clientHeight || innerHeight * 0.72) - 60);
    wrap.innerHTML = items.map(({ v, d }) => {
      const src = v === 'R3' ? `${P.r3}${e.r3_compare}.html` : `${P.emails}${e.template_id}.html`;
      return frame(src, WIDTHS[d], `<b>${v}</b> · ${d} ${WIDTHS[d]}`, scale, h / scale);
    }).join('');
  }

  function details(main) {
    const e = byId[S.id];
    const list = visible();
    const i = list.indexOf(e);
    const a = document.createElement('aside');
    const prem = e.premium_assets.map((g) => assetById[g]).filter(Boolean);
    a.innerHTML = `
      <div class="e"><span>${e.code}</span><span>·</span><span>${famLabel[e.family]}</span><span class="cls ${e.visual_class}">${e.visual_class}</span><span>${e.register}</span></div>
      <h1>${esc(e.title)}<i></i></h1>
      <div class="nm">${esc(e.name)} · <span class="keep">${e.template_id}</span></div>
      <h4>INBOX</h4>
      <ul><li><span>SUBJECT</span><span>${e.subject}</span></li><li><span>PREHEADER</span><span>${e.preheader}</span></li><li><span>ACTION</span><span>${esc(e.qa.cta)} →</span></li></ul>
      <h4>ART · ${e.visual_class}</h4>
      <p>${esc(D.class_rule[e.visual_class])}</p>
      ${prem.map((p) => `<div class="asset"><img src="${P.assets}${p.thumb}" alt=""><div><b>${p.asset_id} · ${esc(p.name)}</b><small>${p.aspect_ratio} · REF ${p.reference} · ${(e.premium_crops[p.asset_id] || []).map((f) => f.split('/').pop().replace(/\.jpg$/, '')).join(' · ')}</small></div></div>`).join('')}
      ${e.drawn_assets.length ? `<p style="margin-top:8px;color:var(--mute);font-size:11px">DRAWN: ${e.drawn_assets.map((f) => f.split('/').pop().replace(/\.png$/, '').replace(/^icon-/, '')).join(' · ')}</p>` : ''}
      <h4>COMPOSITION</h4>
      <p>${esc(e.devices)}</p>
      <h4>FAMILY RELATIONSHIP</h4>
      ${e.siblings.length ? `<p style="margin-bottom:8px">SHARES ITS PHOTOGRAPH WITH:</p><div class="chips">${e.siblings.map((s) => `<button class="chip r" data-go="${s}">${byId[s].code} · ${esc(byId[s].title)}</button>`).join('')}</div>` : `<p>${e.visual_class === 'P3' ? 'UTILITY MESSAGE. IT BELONGS TO THE FAMILY THROUGH TYPE, RED SQUARE STOP AND ITS OWN DRAWN DEVICE.' : 'ITS PHOTOGRAPH IS USED BY THIS EMAIL ONLY.'}</p>`}
      <h4>LINEAGE · QA</h4>
      <ul><li><span>LINEAGE</span><span>${esc(e.lineage)}</span></li><li><span>COPY SOURCE</span><span>${esc(e.qa.subject_source)}</span></li><li><span>TOKENS</span><span class="keep">${e.tokens.map((t) => `{{${t}}}`).join(' ')}</span></li><li><span>QA</span><span class="${e.qa.pass ? 'ok' : ''}">${e.qa.pass ? 'PASS' : 'FAIL'}</span></li>${e.r3_compare ? `<li><span>R3 COMPARE</span><span>${e.r3_compare.replace('_R3', '')} · USE VERSION → COMPARE</span></li>` : ''}</ul>
      <div class="nav2"><button data-step="-1" ${i <= 0 ? 'disabled' : ''}>← PREV</button><button data-step="1" ${i < 0 || i >= list.length - 1 ? 'disabled' : ''}>NEXT →</button></div>`;
    a.onclick = (ev) => {
      const go = ev.target.closest('[data-go]');
      const st = ev.target.closest('[data-step]');
      if (go) { S.id = go.dataset.go; S.family = 'ALL'; S.klass = 'ALL'; render(); }
      if (st && !st.disabled) { S.id = list[i + Number(st.dataset.step)].template_id; render(); }
    };
    main.appendChild(a);
  }

  function index(main) {
    const n = document.createElement('nav');
    const v = visible();
    n.innerHTML = D.families.map((f) => {
      const rows = v.filter((e) => e.family === f.id);
      if (!rows.length) return '';
      return `<h3><span>${f.label}</span><span>${rows.length}</span></h3>` + rows.map((e) => `
        <button class="row" data-id="${e.template_id}" aria-current="${e.template_id === S.id}">
          <div class="top"><span>${e.code}</span><span class="cls ${e.visual_class}">${e.visual_class}</span><span>${e.register}</span></div>
          <div class="s">${e.subject}</div><div class="p">${e.preheader}</div></button>`).join('');
    }).join('');
    n.onclick = (ev) => { const r = ev.target.closest('.row'); if (r) { S.id = r.dataset.id; S.view = 'EMAIL'; render(); } };
    main.appendChild(n);
    requestAnimationFrame(() => n.querySelector('[aria-current="true"]')?.scrollIntoView({ block: 'nearest' }));
  }

  function wall(main) {
    const w = document.createElement('div');
    w.className = 'wall';
    const v = visible();
    w.innerHTML = `<div class="legend">${Object.entries(D.class_rule).map(([k, r]) => `<div><span class="cls ${k}">${k}</span> ${esc(r)}</div>`).join('')}</div>` +
      D.families.map((f) => {
        const rows = v.filter((e) => e.family === f.id);
        if (!rows.length) return '';
        return `<h2>${f.label}<span style="color:var(--red)">.</span></h2><p class="voice">${esc(f.voice)}</p><div class="tiles">` + rows.map((e) => `
          <button class="tile" data-id="${e.template_id}"><div class="img"><img src="${P.previews}${e.template_id}_MOBILE.jpg" alt="${esc(e.title)}" loading="lazy"></div>
          <div class="meta"><span>${e.code}</span><span class="cls ${e.visual_class}">${e.visual_class}</span>${e.premium_assets.map((g) => `<span>${g.replace('R4-', '')}</span>`).join('')}</div>
          <div class="ttl">${esc(e.title)}</div><div class="rel">${e.siblings.length ? 'SHARES ART WITH ' + e.siblings.map((s) => byId[s].code).join(', ') : e.visual_class === 'P3' ? 'DRAWN DEVICES ONLY' : 'UNIQUE PHOTOGRAPH'}</div></button>`).join('') + '</div>';
      }).join('');
    w.onclick = (ev) => { const t = ev.target.closest('.tile'); if (t) { S.id = t.dataset.id; S.view = 'EMAIL'; render(); } };
    main.appendChild(w);
  }

  function assets(main) {
    const w = document.createElement('div');
    w.className = 'wall';
    w.innerHTML = `<h2>PREMIUM ASSETS<span style="color:var(--red)">.</span></h2><p class="voice">TEN OPENART IMAGE-TO-IMAGE PHOTOGRAPHS FROM THE DF-I01 / I02 / I03 WORLD. ${D.credits.spent} CREDITS · REGENERATIONS ${D.credits.regenerations} · RESERVE UNUSED. EACH PHOTOGRAPH SERVES ONE P1 MOMENT, AND SOMETIMES A P2 SIBLING THROUGH A DIFFERENT CROP.</p><div class="acards">` +
      D.assets.map((a) => `<div class="acard"><img src="${P.assets}${a.thumb}" alt="${esc(a.name)}" loading="lazy"><div class="in"><div class="id">${a.asset_id} · ${a.aspect_ratio} · REF ${a.reference}</div><div class="n">${esc(a.name)}</div><div class="chips">${a.serves.map((s) => `<button class="chip ${byId[s].visual_class === 'P1' ? 'r' : ''}" data-id="${s}">${byId[s].code} · ${byId[s].visual_class} · ${esc(byId[s].title)}</button>`).join('')}</div></div></div>`).join('') + '</div>';
    w.onclick = (ev) => { const t = ev.target.closest('[data-id]'); if (t) { S.id = t.dataset.id; S.view = 'EMAIL'; render(); } };
    main.appendChild(w);
  }

  function render() {
    const e = byId[S.id];
    if (S.version !== 'R4' && !e.r3_compare) S.version = 'R4';
    seg('view', ['EMAIL', 'FAMILY WALL', 'ASSETS'], 'view');
    seg('family', ['ALL', 'TRANSACTIONAL', 'OPERATIONAL', 'MARKETING'], 'family', { TRANSACTIONAL: 'TRANS', OPERATIONAL: 'OPS', MARKETING: 'MKTG' });
    seg('klass', ['ALL', 'P1', 'P2', 'P3'], 'klass');
    seg('device', ['MOBILE', 'TABLET', 'DESKTOP', 'ALL'], 'device', { ALL: 'ALL 3' });
    seg('version', ['R4', 'R3', 'COMPARE'], 'version');
    for (const b of document.querySelectorAll('#version button')) if (b.dataset.v !== 'R4' && !e.r3_compare) b.disabled = true;
    document.getElementById('devgrp').style.display = S.view === 'EMAIL' ? '' : 'none';
    document.getElementById('vergrp').style.display = S.view === 'EMAIL' ? '' : 'none';
    const pick = document.getElementById('pick');
    pick.innerHTML = visible().map((x) => `<option value="${x.template_id}" ${x.template_id === S.id ? 'selected' : ''}>${x.code} · ${x.visual_class} · ${esc(x.title)}</option>`).join('');
    pick.style.visibility = S.view === 'EMAIL' ? '' : 'hidden';
    pick.onchange = () => { S.id = pick.value; render(); };
    const main = document.getElementById('main');
    main.innerHTML = '';
    if (S.view === 'EMAIL') {
      index(main);
      const wrap = document.createElement('div');
      wrap.className = 'stagewrap';
      main.appendChild(wrap);
      details(main);
      stage(wrap);
    }
    else { index(main); S.view === 'ASSETS' ? assets(main) : wall(main); }
    document.title = `${e.code} ${plain(e.title)} · SITE 00 EMAIL V2 R4`;
    toHash();
  }

  addEventListener('keydown', (ev) => {
    if (S.view !== 'EMAIL' || ev.target.tagName === 'SELECT') return;
    const list = visible();
    const i = list.indexOf(byId[S.id]);
    if (ev.key === 'ArrowDown' || ev.key === 'j') { if (i < list.length - 1) { S.id = list[i + 1].template_id; render(); } }
    if (ev.key === 'ArrowUp' || ev.key === 'k') { if (i > 0) { S.id = list[i - 1].template_id; render(); } }
  });
  let t;
  addEventListener('resize', () => { clearTimeout(t); t = setTimeout(render, 150); });
  addEventListener('hashchange', () => { fromHash(); render(); });
  render();
})();
</script>
</body>
