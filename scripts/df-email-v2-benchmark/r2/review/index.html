<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SITE 00 · EMAIL V2 · R2 ART DIRECTION REVIEW</title>
<style>
  @font-face { font-family: "Saira Semi Condensed"; font-weight: 400; src: url("../../source/fonts/SairaSemiCondensed-400.ttf"); }
  @font-face { font-family: "Saira Semi Condensed"; font-weight: 600; src: url("../../source/fonts/SairaSemiCondensed-600.ttf"); }
  @font-face { font-family: "Saira Semi Condensed"; font-weight: 700; src: url("../../source/fonts/SairaSemiCondensed-700.ttf"); }
  :root { --ink: #141414; --mute: #6b6964; --hair: #dedbd5; --stone: #f2f0ec; --red: #d90c0c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Saira Semi Condensed", "Arial Narrow", Arial, sans-serif; text-transform: uppercase; color: var(--ink); background: #e7e5e0; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
  button { font: inherit; text-transform: inherit; cursor: pointer; }

  header { background: var(--ink); color: #fff; padding: 12px 18px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header .w { font-size: 13px; font-weight: 700; letter-spacing: .32em; }
  header .t { font-size: 11px; letter-spacing: .22em; color: #b9b6b0; }
  header .st { margin-left: auto; font-size: 10px; letter-spacing: .22em; display: flex; align-items: center; gap: 8px; }
  header .st i { width: 7px; height: 7px; background: var(--red); display: inline-block; }

  .bar { background: #fff; border-bottom: 1px solid var(--hair); padding: 10px 18px; display: flex; gap: 22px; flex-wrap: wrap; align-items: center; }
  .grp { display: flex; align-items: center; gap: 8px; }
  .grp > span { font-size: 9.5px; letter-spacing: .26em; color: var(--mute); margin-right: 2px; }
  .seg { display: flex; border: 1px solid var(--ink); }
  .seg button { background: #fff; border: 0; border-right: 1px solid var(--ink); padding: 8px 12px 7px; font-size: 11px; font-weight: 600; letter-spacing: .16em; color: var(--ink); white-space: nowrap; }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .seg button.r1 { color: var(--mute); }
  .seg button.r1[aria-pressed="true"] { background: #6b6964; color: #fff; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: .14em; cursor: pointer; }
  .chk input { accent-color: var(--ink); width: 15px; height: 15px; margin: 0; }

  main { flex: 1; display: flex; min-height: 0; }
  .stagewrap { flex: 1; min-width: 0; display: flex; gap: 18px; justify-content: center; align-items: flex-start; padding: 16px; overflow: hidden; }
  .dev { display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .dev .lab { font-size: 10px; letter-spacing: .24em; color: var(--mute); margin-bottom: 8px; white-space: nowrap; }
  .dev .lab b { color: var(--ink); }
  .frame { background: #fff; box-shadow: 0 1px 0 #cfccc5, 0 10px 30px rgba(0,0,0,.08); overflow: hidden; position: relative; }
  .frame iframe { border: 0; display: block; transform-origin: 0 0; position: absolute; top: 0; left: 0; }

  aside { width: 360px; flex: none; background: #fff; border-left: 1px solid var(--hair); overflow-y: auto; padding: 20px 22px 30px; }
  aside .e { font-size: 10px; letter-spacing: .26em; color: var(--mute); }
  aside h1 { margin: 6px 0 0; font-size: 24px; line-height: 1.05; font-weight: 700; letter-spacing: .01em; }
  aside h1 em { font-style: normal; color: var(--red); }
  aside .job { margin-top: 10px; font-size: 11.5px; line-height: 1.5; letter-spacing: .04em; color: var(--mute); }
  aside dl { margin: 18px 0 0; }
  aside dt { font-size: 9.5px; font-weight: 600; letter-spacing: .26em; color: var(--ink); margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--hair); }
  aside dd { margin: 6px 0 0; font-size: 12.5px; line-height: 1.55; letter-spacing: .03em; color: #2a2926; text-transform: none; }
  aside dd.idea { font-size: 15px; line-height: 1.45; color: var(--ink); text-transform: uppercase; letter-spacing: .02em; font-weight: 600; }
  aside .prem { margin-top: 18px; background: var(--stone); padding: 12px 14px; }
  aside .prem b { display: block; font-size: 9.5px; letter-spacing: .26em; margin-bottom: 6px; }
  aside .prem p { margin: 0; font-size: 12px; line-height: 1.5; text-transform: none; color: #2a2926; }
  aside .foot { margin-top: 22px; font-size: 9.5px; letter-spacing: .2em; line-height: 1.7; color: var(--mute); }
  .openlink { display: inline-block; margin-top: 14px; font-size: 10.5px; font-weight: 600; letter-spacing: .18em; color: var(--ink); }

  @media (max-width: 900px) {
    body { height: auto; display: block; }
    main { display: block; }
    .stagewrap { padding: 12px 8px; }
    aside { width: auto; border-left: 0; border-top: 1px solid var(--hair); }
    .bar { gap: 10px 16px; padding: 10px 12px; }
    header .st { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <span class="w">SITE 00</span>
  <span class="t">CORRESPONDENCE · EMAIL V2 · R2 ART DIRECTION</span>
  <span class="st"><i></i>FOUNDER SELECTION PENDING · NOTHING APPROVED</span>
</header>

<div class="bar">
  <div class="grp"><span>EMAIL</span><div class="seg" id="email"></div></div>
  <div class="grp"><span>DIRECTION</span><div class="seg" id="terr"></div></div>
  <div class="grp"><span>DEVICE</span><div class="seg" id="device"></div></div>
  <label class="chk"><input type="checkbox" id="cmp"> COMPARE WITH R1</label>
</div>

<main>
  <div class="stagewrap" id="stage"></div>
  <aside id="why"></aside>
</main>

<script src="data.js"></script>
<script>
(function () {
  var D = window.R2_DATA;
  var DEVICES = [
    { id: 'mobile', label: 'MOBILE', w: 390 },
    { id: 'tablet', label: 'TABLET', w: 768 },
    { id: 'desktop', label: 'DESKTOP', w: 1024 }
  ];
  var state = { email: 'B01', terr: 'A', device: 'mobile', cmp: false };

  var h = (location.hash || '').replace('#', '').split('/');
  if (/^B0[123]$/.test(h[0])) state.email = h[0];
  if (/^(A|B|C|R1)$/.test(h[1])) state.terr = h[1];
  if (DEVICES.some(function (d) { return d.id === h[2]; })) state.device = h[2];
  if (h[3] === 'compare') state.cmp = true;

  function email() { return D.emails.filter(function (e) { return e.id === state.email; })[0]; }
  function terr() { return email().territories.filter(function (t) { return t.id === state.email + '_' + state.terr; })[0]; }
  function srcFor(key) { return key === 'R1' ? email().r1 : '../territories/' + state.email + '_' + key + '.html'; }

  function seg(el, items, current, onPick) {
    el.innerHTML = '';
    items.forEach(function (it) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = it.label;
      if (it.cls) b.className = it.cls;
      b.setAttribute('aria-pressed', String(it.id === current));
      b.onclick = function () { onPick(it.id); };
      el.appendChild(b);
    });
  }

  function frames() {
    var stage = document.getElementById('stage');
    var dev = DEVICES.filter(function (d) { return d.id === state.device; })[0];
    var keys = state.cmp && state.terr !== 'R1' ? [state.terr, 'R1'] : [state.terr];
    stage.innerHTML = '';
    var narrow = window.innerWidth <= 900;
    var avail = stage.clientWidth - 32 - (keys.length - 1) * 18;
    var each = Math.min(dev.w, Math.floor(avail / keys.length));
    var scale = each / dev.w;
    var viewH = narrow ? Math.round(window.innerHeight * 0.78) : stage.clientHeight - 60;
    keys.forEach(function (k) {
      var wrap = document.createElement('div');
      wrap.className = 'dev';
      var lab = document.createElement('div');
      lab.className = 'lab';
      lab.innerHTML = (k === 'R1' ? '<b>V2 R1</b> · APPROVED EDITORIAL BASELINE' : '<b>R2 · ' + state.email + ' ' + k + '</b> · ' + (terr() ? terr().title : '')) + ' · ' + dev.w + 'PX' + (scale < 1 ? ' · ' + Math.round(scale * 100) + '%' : '');
      var fr = document.createElement('div');
      fr.className = 'frame';
      fr.style.width = Math.round(dev.w * scale) + 'px';
      fr.style.height = viewH + 'px';
      var ifr = document.createElement('iframe');
      ifr.title = k === 'R1' ? 'V2 R1 ' + state.email : 'R2 territory ' + state.email + ' ' + k;
      ifr.src = srcFor(k);
      ifr.style.width = dev.w + 'px';
      ifr.style.height = Math.round(viewH / scale) + 'px';
      ifr.style.transform = 'scale(' + scale + ')';
      fr.appendChild(ifr);
      wrap.appendChild(lab);
      wrap.appendChild(fr);
      stage.appendChild(wrap);
    });
  }

  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }

  function why() {
    var e = email(), t = terr(), el = document.getElementById('why');
    if (state.terr === 'R1') {
      el.innerHTML = '<div class="e">' + e.id + ' · ' + esc(e.name) + '</div><h1>V2 R1<em>.</em></h1>' +
        '<p class="job">' + esc(e.job) + '</p><dl><dt>WHAT R1 ESTABLISHED</dt><dd>' + esc(e.r1_note) + '</dd>' +
        '<dt>WHAT R2 KEEPS</dt><dd>The approved copy, word for word; the SITE 00 identity; uppercase type; personalization; accessibility.</dd>' +
        '<dt>WHAT R2 CHANGES</dt><dd>The graphic art direction only: one central idea, one signature device and a different composition per territory.</dd></dl>' +
        '<a class="openlink" href="' + srcFor('R1') + '" target="_blank" rel="noopener">OPEN R1 ON ITS OWN →</a>';
      return;
    }
    var rows = [
      ['SIGNATURE DEVICE', t.signature_device], ['TYPOGRAPHY', t.typography], ['IMAGE TREATMENT', t.image_treatment],
      ['RHYTHM', t.rhythm], ['WORD / IMAGE', t.word_image], ['ACTION', t.cta], ['RED', t.red_use], ['EMAIL-SAFE BUILD', t.email_safe]
    ];
    el.innerHTML = '<div class="e">' + e.id + ' · ' + esc(e.name) + ' · DIRECTION ' + state.terr + '</div>' +
      '<h1>' + esc(t.title) + '<em>.</em></h1><p class="job">' + esc(e.job) + '</p>' +
      '<dl><dt>CENTRAL IDEA</dt><dd class="idea">' + esc(t.central_idea) + '</dd>' +
      rows.map(function (r) { return '<dt>' + r[0] + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('') + '</dl>' +
      '<div class="prem"><b>PREMIUM ASSET CANDIDATE · NOT COMMISSIONED</b><p>' + esc(t.premium_candidate) + '</p></div>' +
      '<a class="openlink" href="' + srcFor(state.terr) + '" target="_blank" rel="noopener">OPEN THIS DIRECTION ON ITS OWN →</a>' +
      '<div class="foot">COPY UNCHANGED FROM THE APPROVED BENCHMARK · IMAGERY RE-ART-DIRECTED FROM EXISTING PLATES · 0 OPENART CREDITS · NO WINNER PRE-SELECTED</div>';
  }

  function render() {
    seg(document.getElementById('email'), D.emails.map(function (e) { return { id: e.id, label: e.id }; }), state.email, function (id) { state.email = id; render(); });
    var ts = email().territories.map(function (t) { return { id: t.id.slice(-1), label: t.id.slice(-1) + ' · ' + t.title }; });
    if (window.innerWidth <= 900) ts = ts.map(function (t) { return { id: t.id, label: t.id }; });
    ts.push({ id: 'R1', label: 'R1', cls: 'r1' });
    seg(document.getElementById('terr'), ts, state.terr, function (id) { state.terr = id; render(); });
    seg(document.getElementById('device'), DEVICES, state.device, function (id) { state.device = id; render(); });
    document.getElementById('cmp').checked = state.cmp;
    history.replaceState(null, '', '#' + [state.email, state.terr, state.device].concat(state.cmp ? ['compare'] : []).join('/'));
    frames();
    why();
  }

  document.getElementById('cmp').onchange = function (ev) { state.cmp = ev.target.checked; render(); };
  var t0;
  window.addEventListener('resize', function () { clearTimeout(t0); t0 = setTimeout(render, 120); });
  render();
})();
</script>
</body>
</html>
