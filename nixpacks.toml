[variables]
PLAYWRIGHT_BROWSERS_PATH = "/app/.cache/ms-playwright"

[phases.setup]
nixPkgs = ["nodejs_22"]
aptPkgs = [
  "ca-certificates",
  "fonts-liberation",
  "fonts-noto-color-emoji",
  "libasound2",
  "libatk-bridge2.0-0",
  "libatk1.0-0",
  "libcairo2",
  "libcups2",
  "libdbus-1-3",
  "libdrm2",
  "libgbm1",
  "libnspr4",
  "libnss3",
  "libpango-1.0-0",
  "libx11-6",
  "libxcb1",
  "libxcomposite1",
  "libxdamage1",
  "libxext6",
  "libxfixes3",
  "libxkbcommon0",
  "libxrandr2"
]

[phases.install]
cmds = [
  "mkdir -p /app/.cache/ms-playwright",
  "npm ci",
  "npx playwright install chromium"
]
