<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393, initial-scale=1">
<title>F09 T03 THE OPEN ENVELOPE</title>
<link rel="stylesheet" href="f09-frame.css">
<style>
  /* T03 — THE OPEN ENVELOPE. One envelope is open: what you can spend. Everything held back is sealed beside it. */
  body { background: #ece4d6; }
  .linen, .window { position: absolute; inset: 0; }
  .window { background: linear-gradient(118deg, rgba(255,251,242,.85) 0%, rgba(255,251,242,0) 38%), linear-gradient(118deg, rgba(0,0,0,0) 58%, rgba(92,72,48,.06) 100%); }

  .head { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: baseline; }
  .head .sample { font: 500 8.5px/1 'JRN Sans'; letter-spacing: .22em; color: #9c8b76; }

  svg.obj { position: absolute; left: 0; top: 50px; width: 340px; height: 260px; overflow: visible; }
  .slip { position: absolute; left: 78px; width: 184px; top: 98px; text-align: center; }
  .slip .k { font: 500 9.5px/1 'JRN Sans'; letter-spacing: .3em; color: #6b5f52; padding-left: .3em; }
  .slip .n { margin-top: 10px; font: 400 52px/1 'JRN Display'; color: var(--emerald); }
  .stamp { position: absolute; left: 262px; top: 192px; transform: rotate(-5deg); border: 1.5px solid var(--emerald); border-radius: 6px; padding: 5px 7px 4px; font: 500 7.5px/1.25 'JRN Sans'; letter-spacing: .18em; color: var(--emerald); text-align: center; background: rgba(249,246,239,.4); }
  .addr { position: absolute; left: 40px; right: 40px; top: 258px; text-align: center; font: 400 13px/1.15 'JRN Display'; color: #7d6d5b; letter-spacing: .03em; }

  .spoken { position: absolute; left: 0; right: 0; top: 340px; display: flex; justify-content: space-between; align-items: baseline; font: 500 10px/1 'JRN Sans'; letter-spacing: .2em; color: var(--ink-2); }
  .spoken b { font-weight: 500; color: var(--ink); }
  .sealed { position: absolute; left: 0; right: 0; top: 362px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .env { position: relative; height: 92px; }
  .env svg { position: absolute; inset: 0; width: 100%; height: 66px; overflow: visible; }
  .env .lab { position: absolute; left: 0; right: 0; top: 74px; text-align: center; font: 500 9.5px/1 'JRN Sans'; letter-spacing: .16em; color: var(--ink); }

  .why { position: absolute; left: 0; right: 0; top: 486px; }
  .acts { position: absolute; left: 0; right: 0; top: 544px; display: grid; grid-template-columns: 1.45fr 1fr; gap: 18px; }
</style>
</head>
<body>
  <!-- IMAGERY (data-imagery): linen ground, window light, the olive liner inside the open flap. Removed / blurred in the blur test. -->
  <svg class="linen" data-imagery width="393" height="852" aria-hidden="true">
    <defs>
      <pattern id="weave" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#ece3d4"/><path d="M0 .5H2" stroke="#e6dccb" stroke-width=".5"/><path d="M1.5 0V2" stroke="#e8decf" stroke-width=".4"/></pattern>
      <filter id="slub"><feTurbulence type="fractalNoise" baseFrequency=".008 .3" numOctaves="3" seed="12"/><feColorMatrix values="0 0 0 0 .62  0 0 0 0 .55  0 0 0 0 .45  0 0 0 .3 0"/></filter>
    </defs>
    <rect width="393" height="852" fill="url(#weave)"/>
    <rect width="393" height="852" filter="url(#slub)"/>
  </svg>
  <div class="window" data-imagery></div>

  <div class="status"><span>9:41</span><span><i style="width:17px"></i><i style="width:15px"></i><i style="width:25px;border-radius:3px"></i></span></div>
  <header class="chrome">
    <span class="ib" aria-label="BACK TO TODAY"><svg viewBox="0 0 24 24"><path d="M15 4.5 7.5 12l7.5 7.5"/></svg></span>
    <span class="ib" style="visibility:hidden"></span>
    <span class="wm">JURNL</span>
    <span class="ib" aria-label="ACCOUNT"><svg viewBox="0 0 24 24"><path d="M12 9a3 3 0 1 0 0 6 3 3 0 1 0 0-6zM12 2.8l1.6 2.3 2.7-.6.6 2.7 2.4 1.4-1.2 2.4 1.2 2.4-2.4 1.4-.6 2.7-2.7-.6L12 21.2l-1.6-2.3-2.7.6-.6-2.7-2.4-1.4 1.2-2.4-1.2-2.4 2.4-1.4.6-2.7 2.7.6z"/></svg></span>
    <span class="ib" aria-label="ASK JURNL"><svg viewBox="0 0 24 24" style="stroke-width:2"><path d="M12 10.5v7M12 6.6v.4"/></svg></span>
  </header>

  <main class="stage" aria-label="SAFE TO SPEND">
    <div class="head"><span class="label">SAFE TO SPEND</span><span class="sample">SAMPLE VALUES · QA SEED</span></div>

    <!-- the open envelope: flap (with liner) behind the slip; the pocket in front of it -->
    <svg class="obj" viewBox="0 0 340 260" aria-hidden="true">
      <defs>
        <filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#5a4630" flood-opacity=".18"/></filter>
        <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="2"/><feColorMatrix values="0 0 0 0 .55 0 0 0 0 .5 0 0 0 0 .42 0 0 0 .07 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
        <pattern id="liner" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
          <rect width="26" height="26" fill="#ebcfc8"/>
          <path d="M4 20 C 9 14, 14 10, 22 6" stroke="#b9787f" stroke-width=".8" fill="none"/>
          <path d="M10 15 c -4 -1 -7 1 -8 4 c 4 1 7 -1 8 -4z M15 11 c 1 -4 4 -6 7 -6 c -1 4 -4 6 -7 6z" fill="#c9949a"/>
        </pattern>
      </defs>
      <g filter="url(#lift)">
        <!-- open flap, folded up behind the slip -->
        <path d="M18 128 L170 -14 L322 128 Z" fill="#efe6d7" stroke="#cbbdab" stroke-width=".8"/>
        <path data-imagery d="M31 124 L170 -4 L309 124 Z" fill="url(#liner)" opacity=".95"/>
        <!-- the slip that carries the answer -->
        <rect x="78" y="22" width="184" height="190" rx="3" fill="#fbf8f2" stroke="#d8ccba" stroke-width=".8"/>
        <rect x="78" y="22" width="184" height="190" rx="3" fill="#000" filter="url(#paper)"/>
        <path d="M92 38H248" stroke="#e4d9c8" stroke-width=".8"/>
        <!-- pocket -->
        <path d="M18 128 H322 V252 H18 Z" fill="#f1e9dc" stroke="#cbbdab" stroke-width=".8"/>
        <path d="M18 128 L150 196 M322 128 L190 196 M18 252 L170 178 L322 252" stroke="#d6c9b6" stroke-width="1" fill="none"/>
        <path d="M18 128 H322 V252 H18 Z" fill="#000" filter="url(#paper)"/>
      </g>
    </svg>
    <div class="slip"><div class="k">CLEAR TO SPEND</div><div class="n">$24,885</div></div>
    <div class="stamp">FULL<br>READING</div>
    <div class="addr">WHAT CAN I SPEND WITHOUT<br>UNDOING THE PLAN?</div>

    <div class="spoken"><span>SEALED · HELD BACK</span><b>$6,075 OF $30,960 CASH</b></div>
    <div class="sealed" id="sealed"></div>

    <div class="why"><div class="btn btn--primary">SEE THE FULL BREAKDOWN</div></div>
    <div class="acts">
      <div class="inline-action">CHANGE WHAT’S HELD<span class="rule"></span><svg class="ic" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></div>
      <div class="inline-action">PLAN<span class="rule"></span><svg class="ic" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></div>
    </div>
  </main>

  <nav class="nav" aria-label="PRIMARY">
    <b data-active><svg viewBox="0 0 24 24"><path d="M12 4a3.8 3.8 0 1 0 0 7.6A3.8 3.8 0 1 0 12 4zM4.5 20.5c.9-3.6 3.8-5.6 7.5-5.6s6.6 2 7.5 5.6"/></svg>HOME</b>
    <b><svg viewBox="0 0 24 24"><path d="M5 7.5h14v9H5zM5 11h14M8 7.5V6M16 7.5V6"/></svg>MONEY</b>
    <b class="plus" aria-label="QUICK ADD"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></b>
    <b><svg viewBox="0 0 24 24"><path d="M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 1 0 0-17zM12 7.5V12l3 2"/></svg>PLAN</b>
    <b><svg viewBox="0 0 24 24"><path d="M6 3.5h8l4 4v13H6zM14 3.5v4h4M9 12h6M9 15h6M9 18h4"/></svg>CREDIT</b>
  </nav>
  <div class="home-ind"></div>

<script>
  // SAMPLE VALUES — QA seed commitments on real SafeToSpendBreakdown fields. One sealed envelope per non-zero held-back
  // field (zero fields get no envelope). Amounts stay sealed on the parent: "the explanation stays closed".
  const S = { cash: 30960, upcoming: 1875, assigned: 2400, goalReserved: 900, tripReserved: 900, purchaseReserved: 0, protected: 0, safetyBuffer: 0 };
  const items = [
    ['upcoming', 'BILLS'], ['assigned', 'PLAN'], ['goalReserved', 'GOALS'], ['tripReserved', 'TRIPS'],
    ['purchaseReserved', 'PURCHASES'], ['protected', 'PROTECTED'], ['safetyBuffer', 'BUFFER'],
  ].filter(([k]) => S[k] > 0);
  const env = (label) => `<div class="env"><svg viewBox="0 0 76 66" preserveAspectRatio="none">
      <filter id="e${label}" x="-20%" y="-20%" width="140%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#5a4630" flood-opacity=".16"/></filter>
      <g filter="url(#e${label})">
        <rect x="1" y="1" width="74" height="62" rx="2" fill="#efe6d7" stroke="#cbbdab" stroke-width=".7"/>
        <path d="M1 3 L38 34 L75 3" fill="#e7dccb" stroke="#cbbdab" stroke-width=".7"/>
        <rect x="30.5" y="26.5" width="15" height="15" rx="4" fill="#6e1f2d"/>
        <path d="M34.5 38 C 36.5 34, 38.5 32, 42 30.5 M37 35 c -1.4 -.2 -2.4 .4 -2.8 1.4 c 1.4 .2 2.4 -.4 2.8 -1.4z M39.5 32.6 c .4 -1.4 1.4 -2.2 2.6 -2.2 c -.4 1.2 -1.4 2 -2.6 2.2z" stroke="#c9949a" stroke-width=".6" fill="#c9949a"/>
      </g></svg><div class="lab">${label}</div></div>`;
  document.getElementById('sealed').innerHTML = items.map(([, l]) => env(l)).join('');
</script>
</body>
</html>
