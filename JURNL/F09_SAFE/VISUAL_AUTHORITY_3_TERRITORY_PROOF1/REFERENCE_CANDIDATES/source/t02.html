<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393, initial-scale=1">
<title>F09 T02 THE PLAIN ANSWER</title>
<link rel="stylesheet" href="f09-frame.css">
<style>
  /* T02 — THE PLAIN ANSWER. The page is one sentence, set into stone. The figure is a word in it; each thing held back is a word you can open. */
  body { background: #efe6d6; }
  .stone, .shade { position: absolute; inset: 0; }

  .head { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: baseline; }
  .head .sample { font: 500 8.5px/1 'JRN Sans'; letter-spacing: .22em; color: #9c8b76; }

  .answer { position: absolute; left: 0; right: 0; top: 40px; color: var(--ink); }
  .cut { text-shadow: 0 1px 0 rgba(255,253,247,.85), 0 -1px 0 rgba(90,72,52,.22); }
  .l1 { font: 400 31px/1.04 'JRN Display'; letter-spacing: .01em; }
  .fig { font: 400 104px/.92 'JRN Display'; color: var(--emerald); margin: 6px 0 0 -4px; letter-spacing: -.01em; }
  .mark { position: relative; height: 18px; margin-top: 10px; }
  .mark .clear { position: absolute; left: 0; top: 6px; height: 2px; background: var(--emerald); }
  .mark .held { position: absolute; top: 6px; right: 0; height: 0; border-top: 2px dotted #9c8b76; }
  .mark .cap { position: absolute; right: 0; top: 13px; font: 500 8.5px/1 'JRN Sans'; letter-spacing: .2em; color: #6b5f52; }
  .rest { margin-top: 18px; font: 400 32px/1.2 'JRN Display'; letter-spacing: .01em; }
  .tok { position: relative; white-space: nowrap; border-bottom: 1.5px solid var(--champagne); padding-bottom: 1px; }
  .tok sup { font: 500 8px/1 'JRN Sans'; letter-spacing: .1em; color: #8a6d3f; margin-left: 2px; vertical-align: 15px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; vertical-align: 5px; margin-left: 4px; height: 24px; padding: 0 8px; border-radius: 6px; background: rgba(15,61,50,.92); color: var(--bone); font: 500 10px/1 'JRN Sans'; letter-spacing: .14em; text-shadow: none; }

  .reading { position: absolute; left: 0; right: 0; top: 392px; display: flex; align-items: center; gap: 9px; font: 500 10px/1.35 'JRN Sans'; letter-spacing: .18em; color: var(--ink-2); }
  .tile { width: 16px; height: 16px; border-radius: 4px; background: var(--emerald); display: grid; place-items: center; flex: none; }
  .tile svg { width: 11px; height: 11px; stroke: var(--bone); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  .why { position: absolute; left: 0; right: 0; top: 484px; }
  .acts { position: absolute; left: 0; right: 0; top: 540px; display: grid; grid-template-columns: 1.45fr 1fr; gap: 18px; }
  .q { position: absolute; left: 0; right: 0; top: 584px; font: 400 14px/1.15 'JRN Display'; color: #8a7a68; letter-spacing: .02em; }
</style>
</head>
<body>
  <!-- IMAGERY (data-imagery): travertine field + olive shade cast across the outer frame. Removed / blurred in the blur test. -->
  <svg class="stone" data-imagery width="393" height="852" aria-hidden="true">
    <filter id="trav"><feTurbulence type="fractalNoise" baseFrequency=".004 .06" numOctaves="4" seed="21"/><feColorMatrix values="0 0 0 0 .80  0 0 0 0 .73  0 0 0 0 .62  0 0 0 .75 0"/></filter>
    <filter id="pores"><feTurbulence type="turbulence" baseFrequency=".05 .32" numOctaves="2" seed="5"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .47  0 0 0 0 .38  0 0 0 -1.4 .62"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="8"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .44  0 0 0 0 .38  0 0 0 .06 0"/></filter>
    <rect width="393" height="852" fill="#efe6d6"/>
    <rect width="393" height="852" filter="url(#trav)"/>
    <rect width="393" height="852" filter="url(#pores)" opacity=".35"/>
    <rect width="393" height="852" filter="url(#grain)"/>
    <rect width="393" height="852" fill="url(#light)"/>
    <defs><radialGradient id="light" cx=".05" cy="0" r="1.1"><stop offset="0" stop-color="#fffaf0" stop-opacity=".75"/><stop offset=".6" stop-color="#fffaf0" stop-opacity="0"/></radialGradient></defs>
  </svg>
  <svg class="shade" data-imagery width="393" height="852" aria-hidden="true">
    <filter id="soft"><feGaussianBlur stdDeviation="4.5"/></filter>
    <g filter="url(#soft)" fill="#5a4a36" opacity=".2">
      <path d="M393 640 C 360 668, 344 700, 330 760 L 336 762 C 350 704, 366 676, 393 652z"/>
      <path d="M372 664 c -20 -2 -34 6 -40 18 c 18 2 32 -6 40 -18z"/><path d="M360 694 c 4 -18 16 -28 32 -28 c -4 16 -16 26 -32 28z"/>
      <path d="M352 716 c -22 -6 -36 0 -44 12 c 20 6 34 0 44 -12z"/><path d="M344 742 c 8 -16 20 -22 34 -20 c -6 14 -20 20 -34 20z"/>
      <path d="M-4 168 C 14 150, 22 128, 26 96 L 21 95 C 17 124, 10 146, -4 160z"/>
      <path d="M8 140 c 18 -2 28 -12 30 -24 c -16 2 -26 10 -30 24z"/><path d="M16 116 c -14 -8 -26 -6 -32 2 c 12 8 24 6 32 -2z"/>
    </g>
  </svg>

  <div class="status"><span>9:41</span><span><i style="width:17px"></i><i style="width:15px"></i><i style="width:25px;border-radius:3px"></i></span></div>
  <header class="chrome">
    <span class="ib" aria-label="BACK TO TODAY"><svg viewBox="0 0 24 24"><path d="M15 4.5 7.5 12l7.5 7.5"/></svg></span>
    <span class="ib" style="visibility:hidden"></span>
    <span class="wm">JURNL</span>
    <span class="ib" aria-label="ACCOUNT"><svg viewBox="0 0 24 24"><path d="M12 9a3 3 0 1 0 0 6 3 3 0 1 0 0-6zM12 2.8l1.6 2.3 2.7-.6.6 2.7 2.4 1.4-1.2 2.4 1.2 2.4-2.4 1.4-.6 2.7-2.7-.6L12 21.2l-1.6-2.3-2.7.6-.6-2.7-2.4-1.4 1.2-2.4-1.2-2.4 2.4-1.4.6-2.7 2.7.6z"/></svg></span>
    <span class="ib" aria-label="ASK JURNL"><svg viewBox="0 0 24 24" style="stroke-width:2"><path d="M12 10.5v7M12 6.6v.4"/></svg></span>
  </header>

  <main class="stage" aria-label="SAFE TO SPEND">
    <div class="head"><span class="label">SAFE TO SPEND</span><span class="sample">SAMPLE VALUES · QA SEED</span></div>

    <div class="answer">
      <div class="l1 cut">YOU CAN SPEND</div>
      <div class="fig cut">$24,885</div>
      <div class="mark" aria-hidden="true"><span class="clear" id="clear"></span><span class="held" id="held"></span><span class="cap">OF $30,960 CASH</span></div>
      <div class="rest cut" id="rest"></div>
    </div>

    <div class="reading"><span class="tile"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>A FULL READING. EVERY BILL HAS AN AMOUNT.</div>
    <div class="why"><div class="btn btn--primary">SEE THE FULL BREAKDOWN</div></div>
    <div class="acts">
      <div class="inline-action">CHANGE WHAT’S HELD<span class="rule"></span><svg class="ic" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></div>
      <div class="inline-action">PLAN<span class="rule"></span><svg class="ic" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></div>
    </div>
    <div class="q">— WHAT CAN I SPEND WITHOUT UNDOING THE PLAN?</div>
  </main>

  <nav class="nav" aria-label="PRIMARY">
    <b data-active><svg viewBox="0 0 24 24"><path d="M12 4a3.8 3.8 0 1 0 0 7.6A3.8 3.8 0 1 0 12 4zM4.5 20.5c.9-3.6 3.8-5.6 7.5-5.6s6.6 2 7.5 5.6"/></svg>HOME</b>
    <b><svg viewBox="0 0 24 24"><path d="M5 7.5h14v9H5zM5 11h14M8 7.5V6M16 7.5V6"/></svg>MONEY</b>
    <b class="plus" aria-label="QUICK ADD"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></b>
    <b><svg viewBox="0 0 24 24"><path d="M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 1 0 0-17zM12 7.5V12l3 2"/></svg>PLAN</b>
    <b><svg viewBox="0 0 24 24"><path d="M6 3.5h8l4 4v13H6zM14 3.5v4h4M9 12h6M9 15h6M9 18h4"/></svg>CREDIT</b>
  </nav>
  <div class="home-ind"></div>

<script>
  // SAMPLE VALUES — QA seed commitments on real SafeToSpendBreakdown fields. The sentence is generated from the data:
  // only non-zero held-back fields become words, in a fixed order, so the sentence never names a thing that holds nothing.
  const S = { cash: 30960, upcoming: 1875, assigned: 2400, goalReserved: 900, tripReserved: 900, purchaseReserved: 0, protected: 0, safetyBuffer: 0 };
  const value = S.cash - (S.upcoming + S.assigned + S.goalReserved + S.tripReserved + S.purchaseReserved + S.protected + S.safetyBuffer);
  const words = [
    ['upcoming', 'BILLS'], ['assigned', 'YOUR PLAN'], ['goalReserved', 'GOALS'], ['tripReserved', 'TRIPS'],
    ['purchaseReserved', 'PURCHASES'], ['protected', 'WHAT YOU HOLD'], ['safetyBuffer', 'YOUR BUFFER'],
  ].filter(([k]) => S[k] > 0);
  const fmt = (n) => '$' + n.toLocaleString('en-US');
  const open = 'assigned'; // the reference shows one word opened in place (the interaction model); the rest stay closed
  const tok = ([k, w]) => `<span class="tok">${w}</span>${k === open ? `<span class="chip">${fmt(S[k])} ASSIGNED</span>` : ''}`;
  const list = words.map(tok);
  const joined = list.length > 1 ? `${list.slice(0, -1).join(', ')} AND ${list.at(-1)}` : list[0];
  document.getElementById('rest').innerHTML = `NOW, AFTER ${joined}.`;
  const w = 340, c = Math.round((value / S.cash) * w);
  document.getElementById('clear').style.width = `${c}px`;
  document.getElementById('held').style.width = `${w - c - 4}px`;
</script>
</body>
</html>
