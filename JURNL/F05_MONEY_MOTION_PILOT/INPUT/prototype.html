let priorFocus;const s=document.getElementById('scrim'),title=document.getElementById('sheetTitle'),lead=document.getElementById('sheetLead'),fields=document.getElementById('sheetFields');function openSheet(name){priorFocus=document.activeElement;title.textContent=name;lead.textContent='Prototype only. No money is transferred, no accounts are modified, and no data is saved.';fields.innerHTML=name==='MOVE MONEY'?'<label>FROM</label><select><option>RIDESHARE CARD</option><option>BANK ACCOUNT</option><option>CASH ON HAND</option></select><label>TO</label><select><option>BANK ACCOUNT</option><option>CASH ON HAND</option><option>RIDESHARE CARD</option></select><label>AMOUNT</label><input inputmode="decimal" placeholder="0.00" aria-label="Example transfer amount"><label>STATUS</label><select><option>SCHEDULED</option><option>IN TRANSIT</option><option>RECEIVED</option></select><p>The destination is not credited merely because a transfer is marked in transit.</p>':name==='USUAL ACCOUNTS'?'<p>Bank account — bills, subscriptions and shopping.</p><p>Rideshare card — income, transfers and credit payments.</p><p>Credit cards — groceries, food and travel.</p><p>Cash on hand — cash tips and cash purchases.</p>':name==='QUICK ADD'?'<p>Opus should invoke the existing global Quick Add overlay here, retaining canonical controls and data ownership.</p>':'<p>This surface will be specified and designed as part of the appropriate child-page batch.</p>';s.classList.add('open');s.querySelector('.close').focus()}function closeSheet(){s.classList.remove('open');priorFocus?.focus?.()}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Tab'&&s.classList.contains('open')){const focusable=[...s.querySelectorAll('button,input,select')];let first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
